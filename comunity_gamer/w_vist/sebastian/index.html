<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunidad Gamer | Acceso</title>
  <link rel="stylesheet" href="/w_vist/css/style_sb.css">
</head>
<body>



  <a href="/thomas/index.html" class="logo-corner-link">
    <img src="/img/nexus.png" alt="Logo Comunidad Gamer" class="logo-corner">
  </a>
  <div class="login-container">
    <div class="login-header">
      <a href="/thomas/index.html" class="back-link">← Volver al inicio</a>
    </div>
    <span class="logo-tag">// Comunidad Gamer</span>
 
    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Iniciar sesión</button>
      <button class="tab-btn" data-tab="registro">Registrarse</button>
    </div>
 
    <!-- FORMULARIO LOGIN -->
    <div class="tab-content active" id="login">
      <h1>PLAYER LOGIN</h1>
      <p class="subtitle">Ingresa tus credenciales para entrar al lobby</p>
 
      <form action="#" method="POST">
        <div class="input-group">
          <label for="usuario">Nickname o Correo</label>
          <input type="text" id="usuario" name="usuario" placeholder="Ej: ShadowKnight99" required>
        </div>
 
        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
 
        <div class="options">
          <label><input type="checkbox" name="recordar"> Recordarme</label>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>
 
        <button type="submit" class="btn-login">Entrar al juego</button>
      </form>
    </div>
 
    <!-- FORMULARIO REGISTRO -->
    <div class="tab-content" id="registro">
      <h1>CREAR CUENTA</h1>
      <p class="subtitle">Únete al lobby y empieza a jugar</p>
 
      <form action="#" method="POST">
        <div class="input-group">
          <label for="nickname">Nickname</label>
          <input type="text" id="nickname" name="nickname" placeholder="Ej: ShadowKnight99" required>
        </div>
 
        <div class="input-group">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>
        </div>
 
        <div class="input-group">
          <label for="password3">Contraseña</label>
          <input type="password" id="password3" name="password3" placeholder="••••••••" required>
        </div>
 
        <div class="input-group">
          <label for="password4">Confirmar contraseña</label>
          <input type="password" id="password4" name="password4" placeholder="••••••••" required>
        </div>
 
        <div class="options">
          <label><input type="checkbox" name="terminos" required> Acepto los términos y condiciones</label>
        </div>
 
        <button type="submit" class="btn-login">Crear cuenta</button>
      </form>
    </div>
 
  </div>

  <script src="/js/inicio.js"></script>
</body>
</html>
